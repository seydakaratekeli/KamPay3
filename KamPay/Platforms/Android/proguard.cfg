# ? GLIDE - Image Loading Optimization
-keep public class * implements com.bumptech.glide.module.GlideModule
-keep class * extends com.bumptech.glide.module.AppGlideModule {
 <init>(...);
}
-keep public enum com.bumptech.glide.load.ImageHeaderParser$** {
  **[] $VALUES;
  public *;
}
-keep class com.bumptech.glide.load.data.ParcelFileDescriptorRewinder$InternalRewinder {
  *** rewind();
}

# ? Glide Disk Cache Factory
-keep class com.bumptech.glide.load.engine.bitmap_recycle.** {*;}
-keep class com.bumptech.glide.load.resource.bitmap.** {*;}
-keep class com.bumptech.glide.request.** {*;}

# ? ANDROIDX RECYCLERVIEW - List Optimization
-keep class androidx.recyclerview.widget.RecyclerView { *; }
-keep class androidx.recyclerview.widget.RecyclerView$Adapter { *; }
-keep class androidx.recyclerview.widget.RecyclerView$ViewHolder { *; }
-keep class androidx.recyclerview.widget.RecyclerView$LayoutManager { *; }

# ? CAMERA2 - QR Scanner Optimization
-keep class android.hardware.camera2.** { *; }
-keep class android.hardware.Camera { *; }

# ? ZXING - Barcode Scanner
-keep class com.google.zxing.** { *; }
-dontwarn com.google.zxing.**

# ? FIREBASE
-keep class com.google.firebase.** { *; }
-keep class com.google.android.gms.** { *; }
-dontwarn com.google.firebase.**
-dontwarn com.google.android.gms.**

# ? MAUI HANDLERS - Custom Handlers
-keep class KamPay.Handlers.** { *; }
-keep class Microsoft.Maui.Handlers.** { *; }

# ? GENEL KURALLAR
-keepattributes *Annotation*
-keepattributes SourceFile,LineNumberTable
-keepattributes Signature
-keepattributes Exceptions
